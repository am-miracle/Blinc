# Blinc Cargo Configuration
# =========================
# Cross-compilation settings for Android and iOS targets

# Android targets - using NDK 27+ standalone toolchain
# The NDK path should be set via ANDROID_NDK_HOME environment variable
# Example: export ANDROID_NDK_HOME=~/Library/Android/sdk/ndk/27.0.12077973

[target.aarch64-linux-android]
linker = "aarch64-linux-android35-clang"
ar = "llvm-ar"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi35-clang"
ar = "llvm-ar"

[target.x86_64-linux-android]
linker = "x86_64-linux-android35-clang"
ar = "llvm-ar"

[target.i686-linux-android]
linker = "i686-linux-android35-clang"
ar = "llvm-ar"

# wasm32-unknown-unknown — `getrandom 0.3` (pulled by `ahash 0.8.12`
# from `blinc_node_editor` + `blinc_portal_ui`) requires opting into
# its `wasm_js` backend via a build-time cfg. Enabling the cargo
# feature alone is insufficient (the crate's own compile_error says
# so). Setting the cfg here makes every wasm32 build of the workspace
# pick the browser-backed RNG; demos that don't transitively pull
# getrandom 0.3 are unaffected.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# iOS targets (requires Xcode)
[target.aarch64-apple-ios]
# Uses default Apple toolchain

[target.aarch64-apple-ios-sim]
# Uses default Apple toolchain

[target.x86_64-apple-ios]
# Uses default Apple toolchain (simulator)

# Build settings
[build]
# Uncomment to set a default target:
# target = "aarch64-linux-android"
#
# ── Low-resource machines (e.g. 8 GB RAM / small SSD) ─────────────────
# These are left COMMENTED so they don't cap well-provisioned machines.
# Uncomment locally (or use the env override noted on each line).
#
# Cap parallel codegen so N rustc processes don't collectively exhaust
# RAM. Start around half your core count; lower it if builds still
# thrash/OOM. Env override: CARGO_BUILD_JOBS=4
# jobs = 4
#
# Drop incremental artifacts to reclaim SSD space (they can add GBs to
# target/). Slower warm rebuilds, much smaller footprint.
# Env override: CARGO_INCREMENTAL=0
# incremental = false

# A faster, lower-memory linker cuts link time and peak RAM substantially
# (linking is the heaviest single step on constrained machines). Install
# one, then uncomment the block for your platform:
#   Linux:  sudo apt install mold     macOS: lld ships with `brew install llvm`
#
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
#
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[env]
# These can be overridden by environment variables
# ANDROID_NDK_HOME = { value = "", force = false }
# ANDROID_SDK_HOME = { value = "", force = false }

[alias]
# Convenience aliases for Android builds
android-arm64 = "build --target aarch64-linux-android -p blinc_platform_android"
android-arm = "build --target armv7-linux-androideabi -p blinc_platform_android"
android-x64 = "build --target x86_64-linux-android -p blinc_platform_android"
android-x86 = "build --target i686-linux-android -p blinc_platform_android"
android-all = ["android-arm64", "android-arm", "android-x64", "android-x86"]

# iOS builds
ios-device = "build --target aarch64-apple-ios -p blinc_platform_ios"
ios-sim = "build --target aarch64-apple-ios-sim -p blinc_platform_ios"
